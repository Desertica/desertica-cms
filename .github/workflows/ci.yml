name: CI

on:
  pull_request:
    branches: [develop, staging, prod]
  push:
    branches: [develop, staging, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOST: 127.0.0.1
      PORT: 1337
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/smoke.db
      APP_KEYS: ci1,ci2,ci3,ci4
      API_TOKEN_SALT: ci
      ADMIN_JWT_SECRET: ci
      TRANSFER_TOKEN_SALT: ci
      ENCRYPTION_KEY: ci
      JWT_SECRET: ci
      FORMS_PROXY_SECRET: ci
      CLIENT_URLS: http://localhost:4200
      SEED_ON_EMPTY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run seed-check
      - run: npm run build
      - name: Start Strapi on an empty database, wait for /_health and check the Editor role
        env:
          NODE_ENV: production
        run: |
          npm start > smoke.log 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:1337/_health)" = 204 ] && exec node scripts/verify-editor.mjs
            kill -0 $pid 2>/dev/null || break
            sleep 2
          done
          cat smoke.log; exit 1

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: The image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

