name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No attribution trailers or bot authors
        run: |
          range="origin/${{ github.base_ref }}..HEAD"
          if git log --format=%B "$range" | grep -i -E '^(co-authored-by|claude-session):|generated with \[claude' ; then
            echo "::error::Remove Co-Authored-By / Claude trailers from commit messages"; exit 1
          fi
          if git log --format='%ae %ce' "$range" | grep -i 'anthropic.com'; then
            echo "::error::Commits must be authored by a person"; exit 1
          fi
      - name: Branch name
        run: |
          case "${{ github.head_ref }}" in
            claude/*) echo "::error::Branch names must not start with claude/"; exit 1;;
          esac

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Seed is valid JSON with the expected shape
        run: npm run seed-check
      - name: Build admin panel
        run: npm run build
        env:
          APP_KEYS: ci1,ci2,ci3,ci4
          API_TOKEN_SALT: ci
          ADMIN_JWT_SECRET: ci
          TRANSFER_TOKEN_SALT: ci
          ENCRYPTION_KEY: ci
          JWT_SECRET: ci
